    <meta name="description" content="Pilih salah satu dari 12 level pembelajaran CardioExplore 3D." />
    <title>Semua Level — CardioExplore 3D</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('cardio-theme');
        const systemTheme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = savedTheme || systemTheme;
      })();
    </script>
    <style>
      :root { color-scheme: dark; background: #09131d; }
      :root[data-theme='light'] { color-scheme: light; background: #f3f7f8; }
      body { min-height: 100vh; margin: 0; background: #09131d; }
      :root[data-theme='light'] body { background: #f3f7f8; }
    </style>
